name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium
      # builds, starts the store and runs the smoke tests against the live Shopify catalogue
      - run: npm run test:e2e
        env:
          SHOPIFY_STORE_DOMAIN: avvvsglobal.myshopify.com
          NEXT_PUBLIC_SITE_URL: http://localhost:3105
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
